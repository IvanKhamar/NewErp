# Monthly dependency updates as PRs; CI checks each one. Security fixes come sooner: Dependabot opens those as soon as
# GitHub knows the vulnerability (needs "Dependabot security updates" on in the repo settings).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # One PR for minor and patch updates; a major version (EF Core, MudBlazor) comes on its own, because it may need code changes.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
